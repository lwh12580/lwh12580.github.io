<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>张三 · 个人主页</title>
<meta name="description" content="个人主页 · 作品与项目展示">
<style>
  :root {
    --primary: #4f6ef7;
    --primary-dark: #3a55d9;
    --bg: #f7f8fc;
    --card: #ffffff;
    --text: #1f2430;
    --text-soft: #6b7280;
    --border: #e5e7eb;
    --radius: 14px;
    --shadow: 0 4px 20px rgba(31, 36, 48, .06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(ellipse 900px 520px at 88% -120px, rgba(240,171,252,.20), transparent 70%),
      radial-gradient(ellipse 820px 480px at -5% 260px, rgba(129,140,248,.16), transparent 70%),
      linear-gradient(180deg, #eef1fe 0%, #f7f8fc 640px);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.7;
  }
  a { color: inherit; text-decoration: none; }
  .container { max-width: 960px; margin: 0 auto; padding: 0 24px; }

  /* ===== 顶部导航 ===== */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  nav .container { display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .nav-logo { font-weight: 700; font-size: 18px; color: var(--primary); }
  .nav-links { display: flex; gap: 24px; font-size: 15px; }
  .nav-links a { color: var(--text-soft); transition: color .2s; }
  .nav-links a:hover { color: var(--primary); }

  /* ===== Hero ===== */
  .hero {
    position: relative; overflow: hidden;
    padding: 80px 0 60px; text-align: center;
    background-image: radial-gradient(circle, rgba(79,110,247,.10) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .hero::before, .hero::after {
    content: ""; position: absolute; border-radius: 50%;
    filter: blur(80px); opacity: .5; pointer-events: none;
  }
  .hero::before { width: 420px; height: 420px; background: #a5b4fc; top: -140px; left: -120px; }
  .hero::after  { width: 460px; height: 460px; background: #f0abfc; bottom: -200px; right: -140px; }
  .hero .container { position: relative; z-index: 1; }
  .avatar {
    width: 120px; height: 120px; border-radius: 50%;
    object-fit: cover; border: 4px solid #fff;
    box-shadow: var(--shadow);
    background: linear-gradient(135deg, var(--primary), #8b9cff);
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 44px; font-weight: 700;
  }
  .hero h1 { font-size: 36px; margin-top: 20px; }
  .hero .role {
    display: inline-block; margin-top: 10px; padding: 4px 16px;
    background: rgba(79,110,247,.1); color: var(--primary);
    border-radius: 999px; font-size: 15px; font-weight: 500;
  }
  .hero .tagline { margin: 16px auto 0; max-width: 560px; color: var(--text-soft); font-size: 16px; }
  .hero-actions { margin-top: 28px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .btn {
    padding: 10px 24px; border-radius: 10px; font-size: 15px; font-weight: 500;
    cursor: pointer; border: none; transition: all .2s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
  .btn-ghost { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }

  /* ===== 通用 section ===== */
  section { padding: 50px 0; }
  .section-title { font-size: 24px; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
  .section-title::before { content: ""; width: 6px; height: 24px; border-radius: 3px; background: var(--primary); }

  /* ===== 关于我 ===== */
  .about-card {
    background: var(--card); border-radius: var(--radius);
    padding: 28px 32px; box-shadow: var(--shadow);
    color: var(--text-soft); font-size: 16px; white-space: pre-wrap;
  }

  /* ===== 技能 ===== */
  .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .skill-item {
    background: var(--card); border-radius: 12px; padding: 16px;
    box-shadow: var(--shadow); text-align: center;
    transition: transform .2s;
  }
  .skill-item:hover { transform: translateY(-3px); }
  .skill-name { font-weight: 600; font-size: 15px; }
  .skill-bar { margin-top: 10px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .skill-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #8b9cff); border-radius: 3px; }
  .skill-level { margin-top: 6px; font-size: 12px; color: var(--text-soft); }

  /* ===== 项目 ===== */
  .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .project-card {
    background: var(--card); border-radius: var(--radius);
    padding: 24px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 10px;
    transition: transform .2s, box-shadow .2s;
  }
  .project-card:hover { transform: translateY(-4px); box-shadow: 0 8px 28px rgba(31,36,48,.1); }
  .project-title { font-size: 18px; font-weight: 700; }
  .project-desc { color: var(--text-soft); font-size: 14px; flex: 1; }
  .project-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    font-size: 12px; padding: 2px 10px; border-radius: 999px;
    background: rgba(79,110,247,.08); color: var(--primary);
  }
  .project-link { font-size: 14px; color: var(--primary); font-weight: 500; }
  .project-link:hover { text-decoration: underline; }

  /* ===== 联系 ===== */
  .contact-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .contact-item {
    background: var(--card); border-radius: 12px; padding: 18px 20px;
    box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px;
    transition: transform .2s;
  }
  .contact-item:hover { transform: translateY(-3px); }
  .contact-icon { font-size: 22px; }
  .contact-label { font-size: 12px; color: var(--text-soft); }
  .contact-value { font-size: 14px; font-weight: 500; word-break: break-all; }

  /* ===== 留言板 ===== */
  .gb-card {
    background: var(--card); border-radius: var(--radius);
    padding: 26px 28px; box-shadow: var(--shadow);
  }
  .gb-note {
    font-size: 13px; color: var(--text-soft); background: #f8f9ff;
    border: 1px dashed rgba(79,110,247,.35); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 18px;
  }
  .gb-note b { color: var(--primary); }
  .gb-form { display: flex; flex-direction: column; gap: 12px; }
  .gb-form input, .gb-form textarea {
    width: 100%; padding: 10px 14px; border: 1px solid var(--border);
    border-radius: 10px; font-size: 15px; font-family: inherit;
    background: #fafbfc; color: var(--text); outline: none;
    transition: border-color .15s, background .15s;
  }
  .gb-form textarea { min-height: 92px; resize: vertical; }
  .gb-form input:focus, .gb-form textarea:focus { border-color: var(--primary); background: #fff; }
  .gb-form-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .gb-count { font-size: 12px; color: var(--text-soft); }

  .gb-list { margin-top: 24px; display: flex; flex-direction: column; }
  .gb-item { display: flex; gap: 12px; padding: 16px 0; border-top: 1px solid var(--border); }
  .gb-avatar {
    flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), #8b9cff);
    color: #fff; font-weight: 600; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .gb-body { flex: 1; min-width: 0; }
  .gb-meta { display: flex; align-items: baseline; gap: 10px; }
  .gb-user { font-weight: 600; font-size: 14px; }
  .gb-time { font-size: 12px; color: var(--text-soft); }
  .gb-text { font-size: 15px; color: #374151; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .gb-empty { text-align: center; color: var(--text-soft); font-size: 14px; padding: 24px 0; }

  footer {
    border-top: 1px solid var(--border); padding: 28px 0;
    text-align: center; color: var(--text-soft); font-size: 14px;
  }

  @media (max-width: 640px) {
    .nav-links { display: none; }
    .hero h1 { font-size: 28px; }
    .hero { padding: 56px 0 40px; }
  }
</style>
</head>
<body>

<nav>
  <div class="container">
    <div class="nav-logo" id="nav-logo">张三</div>
    <div class="nav-links">
      <a href="#about">关于</a>
      <a href="#skills">技能</a>
      <a href="#projects">项目</a>
      <a href="#contact">联系</a>
      <a href="#guestbook">留言</a>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="container">
    <div class="avatar" id="avatar">张</div>
    <h1 id="name">张三</h1>
    <div class="role" id="role">前端工程师</div>
    <p class="tagline" id="tagline">热爱构建美好的网页与产品，欢迎了解我的作品。</p>
    <div class="hero-actions" id="hero-actions"></div>
  </div>
</header>

<main>
  <section id="about">
    <div class="container">
      <h2 class="section-title">关于我</h2>
      <div class="about-card" id="about-text"></div>
    </div>
  </section>

  <section id="skills">
    <div class="container">
      <h2 class="section-title">技能</h2>
      <div class="skills-grid" id="skills-grid"></div>
    </div>
  </section>

  <section id="projects">
    <div class="container">
      <h2 class="section-title">项目作品</h2>
      <div class="projects-grid" id="projects-grid"></div>
    </div>
  </section>

  <section id="contact">
    <div class="container">
      <h2 class="section-title">联系我</h2>
      <div class="contact-grid" id="contact-grid"></div>
    </div>
  </section>

  <section id="guestbook">
    <div class="container">
      <h2 class="section-title">留言板</h2>
      <div class="gb-card">
        <p class="gb-note" id="gb-note"></p>
        <form class="gb-form" id="gb-form" autocomplete="off">
          <input type="text" id="gb-name" maxlength="20" placeholder="你的昵称" required>
          <textarea id="gb-text" maxlength="500" placeholder="说点什么吧，欢迎友善留言…" required></textarea>
          <div class="gb-form-foot">
            <span class="gb-count" id="gb-count">0 / 500</span>
            <button class="btn btn-primary" type="submit">发布留言</button>
          </div>
        </form>
        <div class="gb-list" id="gb-list"></div>
        <div id="cusdis_thread" style="display:none"
             data-host="https://cusdis.com"
             data-app-id=""
             data-page-id="guestbook"
             data-page-url=""
             data-page-title="留言板"></div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="container" id="footer-text">© 2026 张三 · 用 ❤️ 与代码构建</div>
</footer>

<!-- ===== 站点数据（在 admin.html 中可视化编辑后替换此块即可） ===== -->
<script type="application/json" id="site-data">{
  "name": "赖秉权",
  "avatarText": "赖",
  "avatarUrl": "avatar.jpg",
  "role": "学生",
  "tagline": "七5班",
  "about": "你好，我是赖秉权",
  "skills": [],
  "projects": [],
  "contacts": [
    {
      "label": "qq",
      "icon": "💬",
      "value": "1358246057",
      "link": ""
    },
    {
      "label": "bilibili",
      "icon": "囧",
      "value": "taytayswifts",
      "link": ""
    },
    {
      "label": "联系方式",
      "icon": "💬",
      "value": "13015609535",
      "link": ""
    }
  ],
  "footerText": "关注一下喵~",
  "heroBgUrl": "bg.jpg",
  "guestbook": {
    "mode": "local",
    "cusdisAppId": "",
    "cusdisHost": "https://cusdis.com"
  }
}
</script>

<script>
(function () {
  var data = JSON.parse(document.getElementById('site-data').textContent);

  // 基础信息
  document.title = data.name + ' · 个人主页';
  document.getElementById('nav-logo').textContent = data.name;
  document.getElementById('name').textContent = data.name;
  document.getElementById('role').textContent = data.role || '';
  document.getElementById('tagline').textContent = data.tagline || '';
  document.getElementById('footer-text').textContent = data.footerText || ('© ' + new Date().getFullYear() + ' ' + data.name);

  // 头像
  var avatarEl = document.getElementById('avatar');
  if (data.avatarUrl) {
    var img = document.createElement('img');
    img.src = data.avatarUrl;
    img.alt = data.name;
    img.className = 'avatar';
    img.style.width = '120px'; img.style.height = '120px';
    avatarEl.replaceWith(img);
  } else {
    avatarEl.textContent = data.avatarText || (data.name || '?').charAt(0);
  }

  // 背景图片（可选，覆盖 Hero 区默认背景）
  if (data.heroBgUrl) {
    var hero = document.querySelector('.hero');
    hero.style.backgroundImage = 'linear-gradient(rgba(247,248,252,.82), rgba(247,248,252,.82)), url("' + data.heroBgUrl + '")';
    hero.style.backgroundSize = 'cover';
    hero.style.backgroundPosition = 'center';
  }

  // Hero 按钮
  var actions = document.getElementById('hero-actions');
  var primaryContact = (data.contacts || [])[0];
  if (primaryContact && primaryContact.link) {
    var a = document.createElement('a');
    a.className = 'btn btn-primary';
    a.href = primaryContact.link;
    a.textContent = '联系我';
    actions.appendChild(a);
  }
  var gh = (data.contacts || []).filter(function (c) { return /github/i.test(c.label); })[0];
  if (gh && gh.link) {
    var b = document.createElement('a');
    b.className = 'btn btn-ghost';
    b.href = gh.link;
    b.target = '_blank';
    b.rel = 'noopener';
    b.textContent = 'GitHub';
    actions.appendChild(b);
  }

  // 关于我
  document.getElementById('about-text').textContent = data.about || '';

  // 没有内容时隐藏板块
  if (!(data.skills || []).length) document.getElementById('skills').style.display = 'none';
  if (!(data.projects || []).length) document.getElementById('projects').style.display = 'none';

  // 技能
  var sg = document.getElementById('skills-grid');
  (data.skills || []).forEach(function (s) {
    var d = document.createElement('div');
    d.className = 'skill-item';
    d.innerHTML =
      '<div class="skill-name"></div>' +
      '<div class="skill-bar"><div class="skill-bar-fill"></div></div>' +
      '<div class="skill-level"></div>';
    d.querySelector('.skill-name').textContent = s.name;
    d.querySelector('.skill-bar-fill').style.width = (s.level || 0) + '%';
    d.querySelector('.skill-level').textContent = (s.level || 0) + '%';
    sg.appendChild(d);
  });

  // 项目
  var pg = document.getElementById('projects-grid');
  (data.projects || []).forEach(function (p) {
    var d = document.createElement('div');
    d.className = 'project-card';
    var tags = (p.tags || []).map(function (t) {
      return '<span class="tag"></span>';
    }).join('');
    d.innerHTML =
      '<div class="project-title"></div>' +
      '<div class="project-desc"></div>' +
      '<div class="project-tags">' + tags + '</div>' +
      (p.link ? '<a class="project-link" target="_blank" rel="noopener">查看项目 →</a>' : '');
    d.querySelector('.project-title').textContent = p.title;
    d.querySelector('.project-desc').textContent = p.desc;
    var tagEls = d.querySelectorAll('.tag');
    (p.tags || []).forEach(function (t, i) { tagEls[i].textContent = t; });
    if (p.link) d.querySelector('.project-link').href = p.link;
    pg.appendChild(d);
  });

  // 联系方式
  var cg = document.getElementById('contact-grid');
  (data.contacts || []).forEach(function (c) {
    var d = document.createElement('a');
    d.className = 'contact-item';
    if (c.link) { d.href = c.link; d.target = '_blank'; d.rel = 'noopener'; }
    d.innerHTML =
      '<div class="contact-icon"></div>' +
      '<div><div class="contact-label"></div><div class="contact-value"></div></div>';
    d.querySelector('.contact-icon').textContent = c.icon || '🔗';
    d.querySelector('.contact-label').textContent = c.label || '';
    d.querySelector('.contact-value').textContent = c.value || '';
    cg.appendChild(d);
  });

  /* ============ 留言板 ============ */
  (function initGuestbook() {
    var cfg = data.guestbook || { mode: 'local' };
    var form = document.getElementById('gb-form');
    var listEl = document.getElementById('gb-list');
    var noteEl = document.getElementById('gb-note');
    var nameEl = document.getElementById('gb-name');
    var textEl = document.getElementById('gb-text');
    var countEl = document.getElementById('gb-count');
    var threadEl = document.getElementById('cusdis_thread');
    var KEY = 'guestbook-' + (data.name || 'site');

    textEl.addEventListener('input', function () {
      countEl.textContent = textEl.value.length + ' / 500';
    });

    // 共享模式：Cusdis（匿名留言，所有访客可见，需填 app id）
    if (cfg.mode === 'cusdis' && cfg.cusdisAppId) {
      noteEl.style.display = 'none';
      form.style.display = 'none';
      listEl.style.display = 'none';
      threadEl.style.display = 'block';
      threadEl.setAttribute('data-app-id', cfg.cusdisAppId);
      var host = cfg.cusdisHost || 'https://cusdis.com';
      threadEl.setAttribute('data-host', host);
      threadEl.setAttribute('data-page-url', location.href.split('#')[0]);
      var s = document.createElement('script');
      s.src = host + '/js/cusdis.es.js';
      s.async = true; s.defer = true;
      document.body.appendChild(s);
      return;
    }

    // 本地模式（默认）：留言保存在当前浏览器
    noteEl.innerHTML = '当前是 <b>本地留言模式</b>：留言只保存在你自己的浏览器里。想让所有访客都能留言，见 README「开启真实留言」。';

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; }
    }
    function save(arr) {
      try { localStorage.setItem(KEY, JSON.stringify(arr)); } catch (e) {}
    }
    function timeAgo(t) {
      var d = Date.now() - t;
      if (d < 60e3) return '刚刚';
      if (d < 3600e3) return Math.floor(d / 60e3) + ' 分钟前';
      if (d < 86400e3) return Math.floor(d / 3600e3) + ' 小时前';
      if (d < 86400e3 * 30) return Math.floor(d / 86400e3) + ' 天前';
      var x = new Date(t);
      return x.getFullYear() + '-' + (x.getMonth() + 1) + '-' + x.getDate();
    }
    function render() {
      var arr = load().sort(function (a, b) { return b.time - a.time; });
      listEl.innerHTML = '';
      if (!arr.length) {
        var e = document.createElement('div');
        e.className = 'gb-empty';
        e.textContent = '还没有留言，来做第一个留言的人吧 ~';
        listEl.appendChild(e);
        return;
      }
      arr.forEach(function (m) {
        var item = document.createElement('div');
        item.className = 'gb-item';
        item.innerHTML = '<div class="gb-avatar"></div><div class="gb-body">' +
          '<div class="gb-meta"><span class="gb-user"></span><span class="gb-time"></span></div>' +
          '<div class="gb-text"></div></div>';
        item.querySelector('.gb-avatar').textContent = (m.name || '匿').charAt(0);
        item.querySelector('.gb-user').textContent = m.name || '匿名';
        item.querySelector('.gb-time').textContent = timeAgo(m.time);
        item.querySelector('.gb-text').textContent = m.text;
        listEl.appendChild(item);
      });
    }

    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var name = (nameEl.value || '').trim();
      var text = (textEl.value || '').trim();
      if (!name || !text) return;
      var arr = load();
      arr.push({ name: name.slice(0, 20), text: text.slice(0, 500), time: Date.now() });
      save(arr);
      try { localStorage.setItem(KEY + '-name', name); } catch (e) {}
      textEl.value = '';
      countEl.textContent = '0 / 500';
      render();
    });

    try {
      var savedName = localStorage.getItem(KEY + '-name');
      if (savedName) nameEl.value = savedName;
    } catch (e) {}
    render();
  })();
})();
</script>
</body>
</html>
